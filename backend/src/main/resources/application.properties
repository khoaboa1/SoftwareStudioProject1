spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/handoff
spring.datasource.username=handoff
spring.datasource.password=handoff
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Flyway (SSP1-87) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Outgoing Email (Gmail SMTPS - Port 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


# --- Google Apps Script HTTPS Email Relay (Method 1) ---
mail.webhook.url=https://script.google.com/macros/s/AKfycbwLvUSfN21iRjXKsdVqwGhk7-ljHQgpSXsxNKKaPYYTlaowpy5Mx_vX9yabMNNopFZwWA/exec
