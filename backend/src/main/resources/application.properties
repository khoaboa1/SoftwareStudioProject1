spring.application.name=backend

# --- Database: Supabase PostgreSQL (SSP1-107) ---
# Values come from environment variables or a gitignored .env file.
# Never commit real credentials. Use Supabase's Session pooler connection (port 5432).
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase's free tier allows a limited number of pooler connections.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# --- Flyway (SSP1-87) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Outgoing Email (Gmail SMTPS - Port 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


# --- Google Apps Script HTTPS Email Relay (Method 1) ---
mail.webhook.url=${MAIL_WEBHOOK_URL:}
